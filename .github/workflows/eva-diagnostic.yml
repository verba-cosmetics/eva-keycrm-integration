name: EVA API diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check EVA authentication
        env:
          EVA_USERNAME: ${{ secrets.EVA_USERNAME }}
          EVA_PASSWORD: ${{ secrets.EVA_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          username = os.environ.get("EVA_USERNAME", "")
          password = os.environ.get("EVA_PASSWORD", "")
          if not username or not password:
              print("Missing EVA secrets")
              sys.exit(1)
          req = urllib.request.Request(
              "https://merchant-api.eva.ua/api/v1/token",
              data=json.dumps({"username": username, "password": password}).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST")
          try:
              with urllib.request.build_opener(NoRedirect()).open(req, timeout=30) as r:
                  print("EVA HTTP status:", r.status)
                  try:
                      payload = json.load(r)
                      valid = isinstance(payload, dict) and isinstance(payload.get("access"), str) and bool(payload["access"])
                  except (ValueError, TypeError):
                      valid = False
                  print("Access token received:", "yes" if valid else "no")
                  sys.exit(0 if valid else 1)
          except urllib.error.HTTPError as e:
              print("EVA HTTP status:", e.code)
              print("Content type:", e.headers.get_content_type())
              if e.headers.get_content_type() == "application/json":
                  try:
                      payload = json.loads(e.read(16384))
                      messages = []
                      if isinstance(payload, dict):
                          for key in ("detail", "message", "error", "code", "reason", "errors"):
                              if key in payload:
                                  messages.append(json.dumps(payload[key], ensure_ascii=False))
                          print("Known error fields:", ", ".join(k for k in ("detail", "message", "error", "code", "reason", "errors") if k in payload) or "none")
                      elif isinstance(payload, str):
                          messages.append(payload)
                      raw = " ".join(messages).lower()
                      groups = {
                          "network/location restriction": ("ip address", "ip_address", "whitelist", "allowlist", "geo", "country", "region", "blocked ip", "ip-адрес", "країн"),
                          "credentials/account": ("no active account", "invalid credentials", "invalid password", "invalid username", "inactive account", "account disabled", "неправильн", "неактивн"),
                          "CSRF": ("csrf",),
                          "permission/access": ("permission", "access denied", "forbidden", "not allowed", "not authorized", "доступ", "заборон"),
                          "rate limit": ("throttl", "rate limit", "too many requests"),
                          "verification/challenge": ("captcha", "challenge", "verify", "verification"),
                      }
                      matches = [label for label, words in groups.items() if any(word in raw for word in words)]
                      print("Error category:", ", ".join(matches) or "unclassified")
                  except (ValueError, TypeError):
                      print("Error response could not be classified")
              sys.exit(1)
          except Exception:
              print("EVA connection failed")
              sys.exit(1)
          PY
